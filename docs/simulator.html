 else if(m=='vld'||m=='vst'){const id=m=='vld'?d.rd:d.rs1,V=vreg(m,id,m=='vld'?'vd':'vs'),base=m=='vld'?S.r[d.rs1]:S.r[d.rd],ad=base+d.imm;[0,4,8].forEach(k=>chkw(ad+k));
  if(m=='vld'){lv=[V,ad];txt=`address ${hx(ad,4)} = ${base} + ${d.imm}; three words are read into r${V}, r${V+1}, r${V+2} in MA`}else{sv=[ad,[0,1,2].map(i=>S.r[V+i])];txt=`address ${hx(ad,4)} = ${base} + ${d.imm}; r${V}, r${V+1}, r${V+2} are written in MA`}}

function exec(c){const d=c.d,pc=c.pc,a=c.a,b=c.b,f=d.f,m=d.mn;let next=pc+8,wr=null,wr2=null,mw=null,ml=null,mw2=null,rt=null,fl=null,txt='';
 if(f=='R'){const r=A[m](a,b);wr=[d.rd,r];txt=`${m}(${a}, ${b}) = ${r}`}
 else if(f=='C'){const e=a==b,g=a>b;fl=[+e,+g,+(!e&&!g)];txt=`compare ${a} with ${b} → E=${fl[0]} GT=${fl[1]} ST=${fl[2]}`}
 else if(f=='U'&&(m=='not'||m=='pcnt')){const r=m=='not'?~a:pcnt(a);wr=[d.rd,r];txt=`${m}(${a}) = ${r}`}
 else if(f=='S'){const r=m=='incr'?a+1|0:m=='decr'?a-1|0:a<0?-a|0:a;wr=[d.rs1,r];txt=`${m}(${a}) = ${r}`}
 else if(f=='B'){const u=a>>>0,k=1<<d.bit,r=(m=='tog'?u^k:m=='sbit'?u|k:u&~k)|0;wr=[d.rd,r];txt=`${m}(${a}, bit ${d.bit}) = ${r}`}
 else if(f=='J'){const take=m=='b'||m=='call'||(m=='beq'&&S.e)||(m=='bgt'&&S.g)||(m=='bst'&&S.s);

 else if(f=='N'&&m=='nop')txt='no operation';
 else if(m=='ld'){const ad=a+d.imm;chkw(ad);ml=[d.rd,ad];txt=`address ${hx(ad,4)} = ${a} + ${d.imm}; the word is read in WB`}
 else if(m=='st'){const ad=a+d.imm;chkw(ad);mw=[ad,b];txt=`address ${hx(ad,4)} = ${a} + ${d.imm}; ${b} is written in WB`}
 else if(m=='push'){const sp=c.sp>>>0;if(sp<4||sp>MEMSZ)throw Error('Stack overflow (data memory is full)');mw=[sp-4,a];wr=[30,sp-4];txt=`push ${a} at ${hx(sp-4,4)}: sp ${sp} → ${sp-4}`}
 else if(m=='pop'||m=='peek'){const sp=c.sp>>>0;if(sp+4>MEMSZ)throw Error('Stack underflow (stack is empty)');ml=[d.rd,sp];if(m=='pop')wr2=[30,sp+4];txt=`${m}: word at ${hx(sp,4)} is read`+(m=='pop'?`; sp → ${sp+4}`:'')}

 else if(m=='ret'){const sp=c.sp>>>0;if(sp+8>MEMSZ)throw Error('Stack underflow (ret needs a return address and the saved ra)');rt=sp;wr=[30,sp+8];txt=`return: pop the return address and the saved ra from ${hx(sp,4)}`}
 else if(f=='F'&&m[0]!='v'){const x=fv(a),y=fv(b),r=fb(fr(m=='fadd'?x+y:m=='fsub'?x-y:m=='fmul'?x*y:x/y));wr=[d.rd,r];txt=`${m}(${ft(a)}, ${ft(b)}) = ${ft(r)}`}
 else if(f=='D'){const x=fv(a),y=fv(b);fl=(isNaN(x)||isNaN(y))?[0,0,0]:x==y?[1,0,0]:x>y?[0,1,0]:[0,0,1];txt=`fcmp ${ft(a)} with ${ft(b)} → E=${fl[0]} GT=${fl[1]} ST=${fl[2]}`}
 else if(f=='U'&&(m=='sqrt'||m=='fabs'||m=='sin'||m=='cos')){const x=fv(a),r=m=='fabs'?(a&0x7fffffff):fb(fr(m=='sqrt'?Math.sqrt(x):m=='sin'?Math.sin(x):Math.cos(x)));wr=[d.rd,r];txt=`${m}(${ft(a)}) = ${ft(r)}`}
 else if(/^v(add|sub|dot|crs|mag|ang|ld|st)$/.test(m)){const v=vexec(d,m);return{wr:v.wr,wv:v.wv,lv:v.lv,sv:v.sv,wr2:null,mw:null,mw2:null,ml:null,rt:null,fl:null,next,txt:v.txt}}

 return{wr,wr2,mw,mw2,ml,rt,fl,next,txt}}
let FMT='both';try{FMT=localStorage.getItem('risc201fmt')||'both'}catch(e){}
const ft=v=>{const x=fv(v);return Number.isFinite(x)?String(Number(x.toPrecision(7))):String(x)};
// vt: a 32-bit word shown as an integer, a float, or both, depending on the Show selector
const vt=v=>FMT=='int'?String(v):FMT=='float'?ft(v)+'f':`${v} (${ft(v)}f)`;
const $=id=>document.getElementById(id),h=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let P=[],rows=[],sym={},S,bps=new Set(),timer=null,dirty=true,first=false;
const NM={4:['IF','OF','EX','MA+RW'],6:['IF','ID','RR','EX','MA','RW']};
const PH={4:['IF','DEC','EX','WB'],6:['IF','DEC','RR','EX','MA','WB']};
const DESC={IF:'Fetch the instruction using the ip',OF:'Decode and read source operands',ID:'Decode, find register fields, make control signals',RR:'Read source registers',EX:'ALU, address calculation, branch test','MA+RW':'Memory access, then register write-back',MA:'Data-memory access',RW:'Register write-back'};
let MODE=4,NAMES=NM[4];
function out(t,cls=''){const e=document.createElement('div');e.textContent=t;if(cls)e.className=cls;$('log').append(e);$('log').scrollTop=1e9}
function stat(t,cls='mu'){$('status').textContent=t;$('status').className=cls}
function reset(){pause();S={mem:new Uint8Array(MEMSZ),r:new Int32Array(32),e:0,g:0,s:0,stg:0,last:-1,cur:null,halt:null,steps:0,chg:new Set(),t:[],snap:null,pf:[0,0,0]};
 S.r[30]=MEMSZ;$('log').textContent='';stat(P.length?'Ready':'No program');draw()}
function build(){const a=asm($('src').value);P=[];rows=[];sym={};dirty=false;
 if(a.errs.length){reset();a.errs.forEach(e=>out(e,'er'));stat('Assembly failed','er');renderList();return false}
 P=a.words;rows=a.rows;sym=a.sym;reset();out(`Assembled ${P.length} instruction(s), ${P.length*8} bytes.`,'mu');renderList();return true}
function renderList(){const lb={};for(const k in sym)(lb[sym[k]]??=[]).push(k+':');
 $('ls').innerHTML=P.map((w,i)=>{const a=i*8,d=dec(w);return`<tr class="r" data-a="${a}"><td class="bp">${bps.has(a)?'●':''}</td><td>${hx(a,4)}</td><td class="mu">${w.toString(16).padStart(16,'0')}</td><td class="mu">${lb[a]?h(lb[a].join(' ')):''}</td><td>${h(dis(d))}</td></tr>`}).join('');
 draw()}
function halt(kind,msg){S.halt=kind;if(kind=='end'){stat('Halted: end of program','ok');out('— end of program —','ok')}else{stat('Stopped: '+(kind=='ni'?'not implemented':'error'),'er');out(msg,'er')}
 const nz=[];for(let i=0;i<32;i++)if(i!=29&&S.r[i])nz.push(`${rn(i)}=${vt(S.r[i])}`);out('Registers: '+(nz.join('  ')||'all zero')+`   | ${S.steps} instruction(s) executed`,'ok')}
function tick(){if(S.halt)return;const stg=S.stg,ph=PH[MODE][stg],NS=NAMES.length;let pc=S.r[29]>>>0;
 try{
 if(ph=='IF'){S.t=[];S.chg=new Set();S.fchg=false;S.snap=S.r.slice();S.pf=[S.e,S.g,S.s];
  if(pc%8==0&&pc/8>=P.length){S.last=0;return halt('end')}
  if(pc%8)throw Error('Misaligned ip '+hx(pc,4));
  S.cur={pc,w:P[pc/8]};S.t[0]=`ip = <b>${hx(pc,4)}</b><br>word = <code>${S.cur.w.toString(16).padStart(16,'0')}</code><br><span class="mu">next ip = ip + 8</span>`}
 else if(ph=='DEC'){const c=S.cur,d=c.d=dec(c.w);if(!d.valid)throw Error('Unknown opcode 0x'+d.op.toString(16));const R=i=>S.r[i];
  if(d.f=='R'||d.f=='C')c.a=R(d.rs1),c.b=d.I?d.imm|0:R(d.rs2);else if('USB'.includes(d.f))c.a=R(d.rs1);else if(d.f=='L')c.a=R(d.rs1);else if(d.f=='T'){c.a=R(d.rd);c.b=R(d.rs1)}else if(d.f=='K')c.a=R(d.rd);else if(d.f=='M')c.b=d.I?d.imm|0:R(d.rs2);else if((d.f=='F'&&d.mn[0]!='v')||d.f=='D'){c.a=R(d.rs1);c.b=R(d.rs2)}
  c.sp=R(30);c.ra=R(31);
  const fs=['rd','rs1','rs2','imm','bit','mode'].filter(k=>d[k]!==undefined).map(k=>`${k}=${d[k]}`).join(' ');
  S.t[stg]=`<b>${h(dis(d))}</b><br>opcode ${hx(d.op,2)} · type ${d.f}<br>${fs}`+(MODE==4?'<br>'+(c.a!==undefined?`A=${c.a} `:'')+(c.b!==undefined?`B=${c.b}`:''):'')}
 else if(ph=='RR'){const c=S.cur;S.t[stg]=(c.a!==undefined||c.b!==undefined)?(c.a!==undefined?`A = ${c.a}<br>`:'')+(c.b!==undefined?`B = ${c.b}`:''):'<span class="mu">no source registers</span>'}
 else if(ph=='EX'){const c=S.cur;c.x=exec(c);S.t[stg]=h(c.x.txt)}
 else if(ph=='MA'){const c=S.cur,t=macc(c);S.t[stg]=t||'<span class="mu">no data-memory access</span>'}
 else{const c=S.cur,x=c.x;if(x.wr)S.r[x.wr[0]]=x.wr[1];if(x.wv)x.wv.forEach(w=>S.r[w[0]]=w[1]);if(x.wr2)S.r[x.wr2[0]]=x.wr2[1];let mt='';if(MODE==4)mt=macc(c);if(x.ml)S.r[x.ml[0]]=c.mv;if(x.lv)c.mvv.forEach((v,i)=>S.r[x.lv[0]+i]=v);if(x.rt!==null){x.next=c.rv[0];S.r[31]=c.rv[1]}if(x.fl)[S.e,S.g,S.s]=x.fl;
  let nx=x.next;if((S.r[29]>>>0)!=c.pc)nx=S.r[29]>>>0;S.r[29]=nx|0;S.steps++;
  const parts=[];for(let i=0;i<32;i++)if(S.r[i]!=S.snap[i]){S.chg.add(i);if(i!=29)parts.push(`${rn(i)}: ${vt(S.snap[i])} → ${vt(S.r[i])}`)}
  if([S.e,S.g,S.s].some((v,i)=>v!=S.pf[i])){S.fchg=true;parts.push(`flags E=${S.e} GT=${S.g} ST=${S.s}`)}
  S.t[stg]=(x.wr?`<b>${rn(x.wr[0])}</b> ← ${vt(x.wr[1])}`:(x.ml||x.mw||x.wr2||x.rt!==null?'':'no register written'))+(x.wr2?`<br><b>${rn(x.wr2[0])}</b> ← ${x.wr2[1]}`:'')+(x.ml?`<br><b>${rn(x.ml[0])}</b> ← memory[${hx(x.ml[1],4)}] = ${vt(S.r[x.ml[0]])}`:'')+(MODE==4&&mt?'<br>'+mt.replace(/<br>$/,''):'')+(x.fl?`<br>flags ← E=${x.fl[0]} GT=${x.fl[1]} ST=${x.fl[2]}`:'')+`<br>ip ← <b>${hx(nx,4)}</b>`;
  out(`${hx(c.pc,4)}  ${dis(c.d).padEnd(22)}${parts.length?'| '+parts.join(', '):''}`)}
 S.last=stg;S.stg=(stg+1)%NS;stat(`${NAMES[stg]} · step ${S.steps+(stg<NS-1?1:0)}`,'mu')
 }catch(e){S.last=stg;S.stg=0;halt(e instanceof NI?'ni':'err',`${e.message} at ${hx(pc,4)}`)}}
function draw(){const c=$('regs').children;
 for(let i=0;i<32;i++){c[i].children[1].textContent=FMT=='float'?ft(S.r[i]):S.r[i];c[i].children[2].textContent=hx(S.r[i])+(FMT=='both'?' · '+ft(S.r[i])+'f':'');c[i].classList.toggle('chg',S.chg.has(i))}
 [['fe','e'],['fg','g'],['fs','s']].forEach(([id,k])=>$(id).classList.toggle('on',!!S[k]));
 for(let i=0;i<NAMES.length;i++){const b=$('sb'+i);b.classList.toggle('on',S.last==i);b.lastChild.innerHTML=S.t[i]||'<span class="mu">—</span>'}
 const ip=S.r[29]>>>0;document.querySelectorAll('#ls tr').forEach(t=>{t.classList.toggle('cur',+t.dataset.a==ip&&!S.halt||(S.halt&&+t.dataset.a==ip));t.children[0].textContent=bps.has(+t.dataset.a)?'●':''});
 {const sp=S.r[30]>>>0;let t='';if(sp%4||sp>MEMSZ)t='sp is outside data memory!';else if(sp==MEMSZ)t='(empty)';else for(let a=sp,k=0;a<MEMSZ&&k<12;a+=4,k++){t+=`${hx(a,4)}  ${(mr(a)>>>0).toString(16).padStart(8,'0')}  ${vt(mr(a))}${k==0?'   ← top (sp)':''}\n`}$('stk').textContent=t;
  const b=(parseInt($('ma').value,16)||0)&~3;let u='';for(let k=0;k<8;k++){const a=b+4*k;u+=a+4<=MEMSZ&&a>=0?`${hx(a,4)}  ${(mr(a)>>>0).toString(16).padStart(8,'0')}  ${vt(mr(a))}\n`:''}$('mem').textContent=u||'(out of range)'}
 $('cnt').textContent=`· ${S.steps} instruction(s) executed`}
function prep(){if(dirty&&!build())return false;return !S.halt&&P.length>0}
function pause(){clearInterval(timer);timer=null;$('bRun').textContent='▶ Run'}
function start(){clearInterval(timer);$('bRun').textContent='⏸ Pause';
 timer=setInterval(()=>{if(S.halt)return pause();
  if(S.stg==0){if(!first&&bps.has(S.r[29]>>>0)){pause();stat('Paused at breakpoint','mu');return out('Breakpoint at '+hx(S.r[29],4),'mu')}first=false}
  tick();draw();if(S.halt)pause()},Math.max(10,1000-$('spd').value*10))}
$('bS').onclick=()=>{if(prep()){tick();draw()}};
$('bI').onclick=()=>{if(prep()){do tick();while(!S.halt&&S.stg!=0);draw()}};
$('bRun').onclick=()=>{if(timer)return pause();if(prep()){first=true;start()}};
$('bR').onclick=()=>{if(dirty)build();else reset()};
$('fm').value=FMT;
$('fm').onchange=()=>{FMT=$('fm').value;try{localStorage.setItem('risc201fmt',FMT)}catch(e){}draw()};
$('bA').onclick=build;
$('ma').oninput=draw;
$('spd').oninput=()=>{if(timer)start()};
$('src').oninput=()=>{dirty=true;pause()};
$('ls').onclick=e=>{const t=e.target.closest('tr');if(!t)return;const a=+t.dataset.a;bps.has(a)?bps.delete(a):bps.add(a);draw()};
const EX={'Floats and vectors (mov #1.5, fadd, vadd, vdot, vst/vld)':`; mov rd, #1.5 loads the float 1.5 as its 32-bit IEEE-754 bit pattern.
; Use the Show selector above to see each register as an integer, a float, or both.
mov r1, #1.5
mov r2, #2.5
fadd r3, r1, r2      ; 4.0
; vectors: v1 = r20-r22, v2 = r23-r25, v3 = r26-r28
mov r20, #1.0
mov r21, #2.0
mov r22, #3.0
mov r23, #4.0
mov r24, #5.0
mov r25, #6.0
vadd r26, r20, r23   ; (5, 7, 9)
vcrs r26, r20, r23   ; (-3, 6, -3)
vdot r5, r20, r23    ; 32
vmag r7, r20         ; 3.741657
vang r8, r20, r23    ; 0.2257 rad
mov r10, #100
vst r20, r10, #0     ; store v1 at address 100
vld r26, r10, #0     ; load it back into v3`,'Recursive factorial (call/ret + loop)':`; recursive factorial(10) with activation blocks, then iterative 5! pushed on stack
mov r0, 10

mov r6, r1       ; keep 10! in r6

mov r3, 5

mul r1, r1, r3
decr r3
cmp r3, 0
bgt loop
push r1
b .end
.factorial:
cmp r0, 1
beq .return
bgt .continue
b .return
.continue:

st ra, 4[sp]

ld r0, 0[sp]
ld ra, 4[sp]

nop`,'Factorial of 5 (from the repo)':`; 5! = 120, pushed onto the stack at the end
mov r1, 1        ; result = 1
mov r2, 5        ; counter = 5

decr r2          ; counter--
cmp r2, 0

'Sum of 1 to 10':`; r1 = 1 + 2 + ... + 10 = 55
mov r1, 0
mov r2, 10

pcnt r2, r1       ; population count

mov r1, 0

function buildStages(){NAMES=NM[MODE];$('stg').className='stg'+(MODE==6?' six':'');$('stg').innerHTML=NAMES.map((n,i)=>`<div class="sb" id="sb${i}"><h3>${n}</h3><div class="mu" style="font-size:11px">${DESC[n]}</div><div></div></div>`).join('')}
buildStages();
$('pm').onchange=()=>{MODE=+$('pm').value;buildStages();if(S.stg||S.cur){reset();build()}else draw()};
$('regs').innerHTML=Array.from({length:32},(_,i)=>`<div class="rg"><span>${i<20?'r'+i:i<29?`r${i} vec${(i-20)/3|0}${'xyz'[(i-20)%3]}`:rn(i)+' (r'+i+')'}</span><b>0</b><i>0x0</i></div>`).join('');
$('ex').innerHTML=Object.keys(EX).map(k=>`<option>${h(k)}</option>`).join('');
$('ex').onchange=()=>{$('src').value=EX[$('ex').value];bps.clear();build()};

</script></body></html>
